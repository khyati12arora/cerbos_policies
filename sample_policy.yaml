---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: resource
  scope: "acme"
  rules:
    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.attr.httpMethod == "GET"
              - expr: request.principal.attr.route.startsWith("/users/")
              - expr: request.principal.attr.role in ["viewer", "editor", "admin"]

    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.attr.httpMethod in ["POST", "PUT"]
              - expr: request.principal.attr.route.startsWith("/users/")
              - expr: request.principal.attr.role in ["editor", "admin"]

    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.attr.httpMethod == "DELETE"
              - expr: request.principal.attr.route.startsWith("/users/")
              - expr: request.principal.attr.role == "admin"

    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.attr.httpMethod in ["GET", "PUT"]
              - expr: request.principal.attr.route.startsWith("/users/")
              - expr: request.principal.attr.role == "viewer"
              - expr: request.resource.attr.ownerId == request.principal.attr.userId
