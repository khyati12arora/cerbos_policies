---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: resource
  scope: "acme"
  rules:
    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.attr.httpMethod == "GET"
              - expr: request.principal.attr.route.startsWith("/users/")
              - expr: >
                  request.principal.attr.role == "viewer" ||
                  request.principal.attr.role == "editor" ||
                  request.principal.attr.role == "admin"

    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: >
                  request.principal.attr.httpMethod == "POST" ||
                  request.principal.attr.httpMethod == "PUT"
              - expr: request.principal.attr.route.startsWith("/users/")
              - expr: >
                  request.principal.attr.role == "editor" ||
                  request.principal.attr.role == "admin"

    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.attr.httpMethod == "DELETE"
              - expr: request.principal.attr.route.startsWith("/users/")
              - expr: request.principal.attr.role == "admin"

    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: >
                  request.principal.attr.httpMethod == "GET" ||
                  request.principal.attr.httpMethod == "PUT"
              - expr: request.principal.attr.route.startsWith("/users/")
              - expr: request.principal.attr.role == "viewer"
              - expr: request.resource.attr.ownerId == request.principal.attr.userId
