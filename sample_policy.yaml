---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: resource
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.attr.route.startsWith("/users/")
              - expr: request.principal.attr.role in ["viewer", "editor", "admin"]

    - actions: ["create", "update"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.attr.route.startsWith("/users/")
              - expr: request.principal.attr.role in ["editor", "admin"]

    - actions: ["delete"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.attr.route.startsWith("/users/")
              - expr: request.principal.attr.role == "admin"

    - actions: ["read", "update"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.attr.route.startsWith("/users/")
              - expr: request.principal.attr.role == "viewer"
              - expr: request.resource.attr.ownerId == request.principal.attr.userId
