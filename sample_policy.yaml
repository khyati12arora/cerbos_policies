---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: resource
  scope: "acme"
  rules:
    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: string(request.principal.attr.httpMethod) == "GET"
              - expr: string(request.principal.attr.route).startsWith("/users/")
              - expr: string(request.principal.attr.role) in ["viewer", "editor", "admin"]

    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: string(request.principal.attr.httpMethod) in ["POST", "PUT"]
              - expr: string(request.principal.attr.route).startsWith("/users/")
              - expr: string(request.principal.attr.role) in ["editor", "admin"]

    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: string(request.principal.attr.httpMethod) == "DELETE"
              - expr: string(request.principal.attr.route).startsWith("/users/")
              - expr: string(request.principal.attr.role) == "admin"

    - actions: ["access"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: string(request.principal.attr.httpMethod) in ["GET", "PUT"]
              - expr: string(request.principal.attr.route).startsWith("/users/")
              - expr: string(request.principal.attr.role) == "viewer"
              - expr: string(request.resource.attr.ownerId) == string(request.principal.attr.userId)
