---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: resource
  scope: "acme"
  rules:
    - actions: ["GET /users/*"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          expr: request.principal.attr.role in ["viewer", "editor", "admin"]

    - actions: ["POST /users/*", "PUT /users/*"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          expr: request.principal.attr.role in ["editor", "admin"]

    - actions: ["DELETE /users/*"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          expr: request.principal.attr.role == "admin"

    - actions: ["GET /users/*", "PUT /users/*"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.attr.role == "viewer"
              - expr: request.resource.attr.ownerId == request.principal.attr.userId
