---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: document
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles:
        - viewer
        - editor
        - admin

    - actions: ["create", "update"]
      effect: EFFECT_ALLOW
      roles:
        - editor
        - admin

    - actions: ["delete"]
      effect: EFFECT_ALLOW
      roles:
        - admin

    - actions: ["read", "update"]
      effect: EFFECT_ALLOW
      roles:
        - viewer
      condition:
        match:
          expr: request.resource.attr.ownerId == request.principal.id
